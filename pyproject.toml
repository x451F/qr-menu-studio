[project]
name = "qr-menu-studio"
version = "0.1.0"
description = "Internal tool to build QR-code restaurant menus"
requires-python = ">=3.13,<3.14"
dependencies = [
    "django>=5.2,<5.3",
    "pillow>=11",
    "segno>=1.6",
    "weasyprint>=66",
    "anthropic>=0.60",
    "gunicorn>=23",
    "whitenoise>=6.9",
]

[dependency-groups]
dev = [
    "pytest>=8",
    "pytest-django>=4.9",
    "playwright>=1.50",
    "ruff>=0.8",
]

[tool.uv]
package = false

[tool.pytest.ini_options]
DJANGO_SETTINGS_MODULE = "config.settings"
python_files = ["test_*.py"]
testpaths = ["menus", "public", "editor", "printing", "ai"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py313"
extend-exclude = ["*/migrations/*"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP", "DJ"]
ignore = ["E501", "E731"]
