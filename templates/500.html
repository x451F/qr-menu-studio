<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex">
<meta name="color-scheme" content="light dark">
<title>Erreur · Error</title>
<style>
:root{--bg:#f6f0e4;--ink:#211a17;--ink2:#5c4f47;--brand:#7a2e2a}
@media (prefers-color-scheme:dark){:root{--bg:#17120f;--ink:#f1e8d8;--ink2:#b8aa98;--brand:#d08a82}}
*{box-sizing:border-box}
body{margin:0;min-height:100dvh;display:grid;place-items:center;padding:24px;background:var(--bg);color:var(--ink);font:400 1.0625rem/1.55 Georgia,"Times New Roman",serif}
main{max-width:26rem;text-align:center}
h1{margin:0 0 8px;font-size:2rem;line-height:1.1;font-weight:600;color:var(--brand)}
p{margin:0 0 12px;color:var(--ink2)}
p.en{font-size:.9375rem}
</style>
</head>
<body>
<main>
<h1>Un instant, s'il vous plaît</h1>
<p>Un incident technique empêche d'afficher cette page. Réessayez dans quelques instants.</p>
<p class="en" lang="en">A technical problem is preventing this page from loading. Please try again in a moment.</p>
</main>
</body>
</html>
