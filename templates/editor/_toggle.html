{% load editor_tags %}<button type="button" class="tgl tgl--{{ kind }}{% if on %} is-on{% endif %}" hx-post="{{ url }}" hx-swap="outerHTML" aria-pressed="{% if on %}true{% else %}false{% endif %}" data-tgl="{{ kind }}"{% if kind == 'soldout' %} title="Mark as sold out"><span>Sold out</span>{% elif kind == 'item_visible' or kind == 'cat_visible' %} title="{% if on %}Visible to diners. Tap to hide.{% else %}Hidden from diners. Tap to show.{% endif %}" aria-label="Visible to diners">{% if on %}{% icon 'eye' %}{% else %}{% icon 'eye-off' %}{% endif %}{% else %} title="Show this special to diners today"><span class="sw" aria-hidden="true"></span><span class="tgl__text">{% if on %}Active{% else %}Off{% endif %}</span>{% endif %}</button>
