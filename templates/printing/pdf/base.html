<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<title>{% block doc_title %}{{ brand.name }}{% endblock %}</title>
<style>
@font-face { font-family: "Display"; font-weight: 400; font-style: normal; src: url("{{ fonts_uri }}/dm-serif-display-latin-400-normal.woff") format("woff"); }
@font-face { font-family: "Display"; font-weight: 400; font-style: italic; src: url("{{ fonts_uri }}/dm-serif-display-latin-400-italic.woff") format("woff"); }
@font-face { font-family: "Body"; font-weight: 400; src: url("{{ fonts_uri }}/inter-latin-400-normal.woff") format("woff"); }
@font-face { font-family: "Body"; font-weight: 500; src: url("{{ fonts_uri }}/inter-latin-500-normal.woff") format("woff"); }
@font-face { font-family: "Body"; font-weight: 600; src: url("{{ fonts_uri }}/inter-latin-600-normal.woff") format("woff"); }
@font-face { font-family: "Body"; font-weight: 700; src: url("{{ fonts_uri }}/inter-latin-700-normal.woff") format("woff"); }
{% block page_rule %}@page { size: A4; margin: 0; }{% endblock %}
* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { background: #fff; }
body { font-family: "Body", sans-serif; color: {{ brand.ink }}; hyphens: manual; }
.qr svg { display: block; width: 100%; height: 100%; }
.display { font-family: "Display", serif; font-weight: 400; }
{% block css %}{% endblock %}
</style>
</head>
<body>
{% block body %}{% endblock %}
</body>
</html>
