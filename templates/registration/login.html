{% load static %}<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<meta name="theme-color" content="#2f4f46">
<title>Sign in · QR Menu Studio</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 32 32%27%3E%3Crect width=%2732%27 height=%2732%27 rx=%277%27 fill=%27%232f4f46%27/%3E%3Cpath d=%27M9 9h5v5H9zM18 9h5v5h-5zM9 18h5v5H9zM18 18h2v2h-2zM21 21h2v2h-2z%27 fill=%27%23fff%27/%3E%3C/svg%3E">
<link rel="stylesheet" href="{% static 'editor/editor.css' %}">
</head>
<body class="login-page">
<main class="login">
  <div class="login__card">
    <div class="login__brand"><span class="brand__mark brand__mark--lg" aria-hidden="true"></span>
      <h1>QR Menu Studio</h1>
      <p>From paper menu to published menu in ten minutes.</p>
    </div>
    <form method="post" class="login__form" novalidate>
      {% csrf_token %}
      {% if locked %}
        <p class="notice notice--error" role="alert">Too many failed attempts. Try again in 15 minutes.</p>
      {% elif form.errors %}
        <p class="notice notice--error" role="alert">That username or password isn't right.</p>
      {% endif %}
      <label class="field">
        <span class="field__label">Username</span>
        <input class="input" type="text" name="username" autocomplete="username" autocapitalize="none" autocorrect="off" spellcheck="false" required autofocus value="{{ form.username.value|default:'' }}">
      </label>
      <label class="field">
        <span class="field__label">Password</span>
        <input class="input" type="password" name="password" autocomplete="current-password" required>
      </label>
      <input type="hidden" name="next" value="{{ next|default:'' }}">
      <button class="btn btn--primary btn--block btn--lg" type="submit"{% if locked %} disabled{% endif %}>Sign in</button>
    </form>
  </div>
</main>
</body>
</html>
